# Golden Dataset for arXiv Research Agent
#
# Schema:
#   id: unique question identifier
#   question: the user-facing question
#   category: literature_review | comparison | specific_result | explain_paper | trap | edge_case
#
#   retrieval_requirements:
#     type: none | topical | specific_paper
#       - none: no retrieval needed (traps, edge cases, malformed input)
#       - topical: agent must retrieve papers about specific topics
#       - specific_paper: agent must fetch a specific arxiv_id (used for explain-a-paper)
#     required_topics: [list of topics that must be covered]
#     minimum_papers_per_topic: how many relevant papers per topic
#     minimum_total_papers: total papers needed across all topics
#     required_paper: specific arxiv_id (only for type=specific_paper)
#
#   synthesis_requirements:
#     must_address: [things the answer must address]
#     must_avoid: [things the answer must not do]
#     target_length_words: expected length range
#     expected_question_type: literature_review | comparison | explain_paper | specific_result | cannot_answer
#
#   refusal_requirements:
#     should_refuse: true | false
#     refusal_reason: what the agent should say
#
# Evaluation strategy:
#   - Retrieval check: deterministic, scriptable. Checks paper titles/abstracts against required_topics.
#   - Synthesis check: LLM-as-judge with rubric against synthesis_requirements.
#   - Refusal check: binary check on whether agent declined when it should.
#
# Total: 60 questions across 6 categories

# =============================================================================
# CATEGORY A: LITERATURE REVIEW (15 questions)
# Tests: coverage, filtering, synthesis, citation accuracy
# =============================================================================

- id: 1
  question: "Give me a literature review on RLHF, covering the canonical papers and their relationships."
  category: literature_review
  retrieval_requirements:
    type: topical
    required_topics: ["RLHF", "reinforcement learning from human feedback"]
    minimum_total_papers: 4
  synthesis_requirements:
    must_address:
      - "Identifies foundational papers (e.g., InstructGPT, DPO, Constitutional AI commonly cited)"
      - "Explains relationships between papers (which extends which)"
      - "Distinguishes original methods from variations"
    must_avoid:
      - "Fabricating paper titles or arxiv IDs"
      - "Treating recent variants as foundational"
    target_length_words: "800-1500"
    expected_question_type: literature_review

